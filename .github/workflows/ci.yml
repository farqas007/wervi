name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: '1'
  DO_NOT_TRACK: '1'

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: wervi
          POSTGRES_PASSWORD: wervi
          POSTGRES_DB: wervi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wervi -d wervi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgresql://wervi:wervi@localhost:5432/wervi_test
      # The database integration tests read this first and fall back to
      # DATABASE_URL only when its name contains "test". Named separately so a
      # developer's local DATABASE_URL can never become a target of `truncate`.
      DATABASE_TEST_URL: postgresql://wervi:wervi@localhost:5432/wervi_test
      DATABASE_SSL: disable

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  migrations:
    name: Migration drift check
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: wervi
          POSTGRES_PASSWORD: wervi
          POSTGRES_DB: wervi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wervi -d wervi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://wervi:wervi@localhost:5432/wervi_test
      DATABASE_SSL: disable

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply committed migrations
        run: pnpm db:migrate

      - name: Fail if the schema has uncommitted changes
        run: |
          pnpm db:generate
          if ! git diff --quiet -- packages/db/drizzle; then
            echo "::error::Drizzle schema and migrations are out of sync. Run 'pnpm db:generate' and commit the result."
            git --no-pager diff -- packages/db/drizzle
            exit 1
          fi
